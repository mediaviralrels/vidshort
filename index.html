<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- MONETAG VERIFICATION -->
    <meta name="monetag" content="7545bb50c6048f103e20c6d037352cbd">

    <title>VideoHub</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #111;
            color: #fff;
            font-family: Arial, sans-serif;
        }

        header {
            padding: 18px;
            background: #1c1c1c;
            text-align: center;
            border-bottom: 1px solid #333;
        }

        header h1 {
            margin: 0;
            font-size: 24px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            padding: 15px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .video-card {
            background: #1d1d1d;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #292929;
        }

        video {
            width: 100%;
            display: block;
            background: #000;
            aspect-ratio: 16 / 9;
        }

        .title {
            padding: 12px;
            font-size: 15px;
            font-weight: bold;
        }

        @media (max-width: 600px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>VideoHub</h1>
</header>

<div class="container">

    <div class="grid">

        <div class="video-card">
            <video controls playsinline preload="metadata">
                <source src="https://cdn2.videy.co/uCJhAh5Z1.mp4" type="video/mp4">
            </video>
            <div class="title">Video 1</div>
        </div>

        <div class="video-card">
            <video controls playsinline preload="metadata">
                <source src="https://cdn2.videy.co/trwQF1bS1.mp4" type="video/mp4">
            </video>
            <div class="title">Video 2</div>
        </div>

        <div class="video-card">
            <video controls playsinline preload="metadata">
                <source src="https://cdn2.videy.co/Np1c6hSF1.mp4" type="video/mp4">
            </video>
            <div class="title">Video 3</div>
        </div>

        <div class="video-card">
            <video controls playsinline preload="metadata">
                <source src="https://cdn2.videy.co/Eb3KzmWK1.mp4" type="video/mp4">
            </video>
            <div class="title">Video 4</div>
        </div>

        <div class="video-card">
            <video controls playsinline preload="metadata">
                <source src="https://cdn2.videy.co/6ma7u0s11.mp4" type="video/mp4">
            </video>
            <div class="title">Video 5</div>
        </div>

    </div>

</div>

</body>
</html>
